<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login — DevAssess</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="glow-orb top"></div>
  <div class="glow-orb bot"></div>

  <div class="card">
    <div class="logo">
      <div class="logo-icon">⚡</div>
      <div class="logo-text">DevAssess</div>
    </div>

    <h1>Welcome back</h1>
    <p class="subtitle">Sign in to your assessment dashboard</p>

    <div id="alert" class="alert"></div>

    <form id="login-form" onsubmit="handleLogin(event)">
      <div class="form-group">
        <label for="email">Email address</label>
        <input type="email" id="email" placeholder="ravi@example.com" autocomplete="email" />
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="Your password" autocomplete="current-password" />
      </div>
      <button type="submit" class="btn">Sign in →</button>
    </form>

    <div class="divider">or</div>

    <p class="link-row" style="margin-top:0">New here? <a href="register.html">Create an account</a></p>
  </div>

  <script src="js/auth.js"></script>
</body>
</html>
